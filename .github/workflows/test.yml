name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:  # oldest supported Python (no 3.9 builds for Ubuntu 26.04 and later) and a current one
          - { python: "3.9", os: ubuntu-24.04 }
          - { python: "3.13", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest -q tests

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check vscode/extension.js
      - run: cd vscode && npx --yes @vscode/vsce package -o jobboard.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: jobboard-vsix
          path: vscode/jobboard.vsix
